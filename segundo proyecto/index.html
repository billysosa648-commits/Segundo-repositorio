<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="./Styles/Sytyles.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>Bienvenido a Dare-tech</h1>
  <h2>Empresa dedicada a la reparacion o restauracion de dispositivos electronicos como computadoras, celulares, tablets, etc.</h2>
  <p>Porfavor describa la falla de su dispositivo en el siguiente campo</p>
  
  <!-- Agregamos el id al form y al textarea para que el script los reconozca -->
  <form id="fallaForm">
    <textarea id="mensajeFalla" name="" cols="30" rows="10"></textarea>
    <button type="submit">Enviar</button>
  </form>

  <!-- Pega el código de JavaScript aquí dentro -->
  <script>
    const form = document.getElementById('fallaForm');
    const textarea = document.getElementById('mensajeFalla');

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      const mensaje = textarea.value.trim();

      if (mensaje === "") {
        alert("Por favor escribe una descripción de la falla.");
        return;
      }

      try {
        const respuesta = await fetch('/.netlify/functions/enviar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mensaje })
        });

        if (respuesta.ok) {
          alert("¡Mensaje enviado con éxito!");
          textarea.value = "";
        } else {
          alert("Hubo un error al enviar el mensaje.");
        }
      } catch (error) {
        alert("Error de conexión.");
      }
    });
  </script>
</body>
</html>
