<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="./Styles/Sytyles.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dare-tech</title>
</head>
<body>
  <h1>Bienvenido a Dare-tech</h1>
  <h2>Empresa dedicada a la reparacion o restauracion de dispositivos electronicos como computadoras, celulares, tablets, etc.</h2>
  <p>Porfavor describa la falla de su dispositivo en el siguiente campo</p>
  
  <!-- Formulario conectado al script -->
  <form id="fallaForm">
    <textarea id="mensajeFalla" cols="30" rows="10" placeholder="Escribe aquí los detalles..."></textarea>
    <button type="submit">Enviar</button>
  </form>

  <!-- Script para enviar los datos a Telegram -->
  <script>
    const TOKEN = "8851518275:AAGD-jhwAfjMh3FR2pyiovUu519Z7yJQoiQ"; // Reemplaza con el token de BotFather
    const CHAT_ID = "8463419003"; // Reemplaza con tu ID de Telegram

    const form = document.getElementById('fallaForm');
    const textarea = document.getElementById('mensajeFalla');

    form.addEventListener('submit', async function(e) {
      e.preventDefault(); // Evita que la página se recargue

      const mensaje = textarea.value.trim();

      if (mensaje === "") {
        alert("Por favor escribe una descripción de la falla.");
        return;
      }

      const textoFinal = `🚨 Nueva falla reportada en Dare-tech:\n\n${mensaje}`;

      try {
        const respuesta = await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text: textoFinal
          })
        });

        if (respuesta.ok) {
          alert("¡Mensaje enviado con éxito! Nos pondremos en contacto pronto.");
          textarea.value = ""; // Limpiar el campo
        } else {
          alert("Hubo un error al enviar el mensaje.");
        }
      } catch (error) {
        console.error("Error:", error);
        alert("Error de conexión.");
      }
    });
  </script>
</body>
</html>
